name: PR builder

on:
  pull_request:
    branches:
      - 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung test, such as a Hazelcast client retrying forever, would otherwise run until GitHub's six-hour limit.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Override MAVEN_OPTS
        run: |-
          echo 'MAVEN_ARGS=--batch-mode --quiet --no-transfer-progress' >> "$GITHUB_ENV"

      - name: Build
        run: |
          mvn package -DskipTests --update-snapshots --activate-profiles checkstyle

      - name: Test from clean outputs
        run: |
          mvn verify -Dmaven.test.failure.ignore=false

      - name: Verify packaging and SpotBugs
        run: |
          mvn verify -DskipTests --activate-profiles spotbugs
